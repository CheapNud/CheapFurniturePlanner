name: Build & Test

# PR-only on purpose: every master commit arrives through a PR this already
# validated, and the tag release rebuilds anyway. A master-push trigger races
# the tag release's build for the runner's shared toolcache volume when a
# release pushes master and the tag together, which stalls both mid-compile.
on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No setup-dotnet: the ubuntu-latest label maps to a runner image with the
      # .NET 11 SDK baked in (ci-dotnet), so the SDK download is gone too.
      # No actions/cache: the runner mounts a persistent nuget-ci-cache volume
      # into every job (act_runner container.options) — restore hits a warm local
      # cache without the tar-and-transfer round trip the cache action cost.
      - name: Restore
        run: dotnet restore CheapFurniturePlanner.sln

      - name: Build
        run: dotnet build CheapFurniturePlanner.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test CheapFurniturePlanner.sln --no-build --configuration Release --verbosity normal

      - name: Postgres provider smoke
        env:
          PLANNER_PG_TEST: ${{ secrets.PLANNER_PG_TEST }}
        run: |
          if [ -n "$PLANNER_PG_TEST" ]; then
            dotnet test CheapFurniturePlanner.Tests.PostgresSmoke/CheapFurniturePlanner.Tests.PostgresSmoke.csproj --no-build --configuration Release --verbosity normal
          else
            echo "PLANNER_PG_TEST secret not set - skipping the Postgres provider smoke."
          fi
